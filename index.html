<!DOCTYPE html>
<html class="light" lang="zh-TW">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Fruit Star Fall - 遊戲主頁</title>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4A90E2",
                        "soft-blue": "#add8e6",
                        "game-pink": "#ffc2cc",
                        "soft-green": "#90ee90",
                        "pale-yellow": "#fffacd",
                        "background-light": "#f0f9ff",
                        "background-dark": "#1a2a33",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "1.5rem",
                        "xl": "2.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-soft-blue min-h-screen overflow-x-hidden text-[#2c3e50];
            }
        }
        .landscape-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            min-height: 100vh;
        }
        @media (max-width: 640px) {
            .landscape-container {
                grid-template-columns: 1fr;
            }
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="font-display flex flex-col">
    <div class="landscape-container flex-grow">
        <!-- 左側導航欄 -->
        <header class="p-8 flex flex-col justify-center items-center md:items-start text-center md:text-left bg-white/20 backdrop-blur-sm border-r border-white/30">
            <div class="bg-white/40 p-4 rounded-full mb-4 shadow-sm">
                <span class="material-icons text-primary text-4xl">star</span>
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-[#2c5282] leading-tight">Fruit Star Fall</h1>
            <p class="text-lg font-medium text-[#4a7a96] mt-2">接住甜蜜，玩轉快樂</p>
            
            <div class="mt-8 flex flex-col gap-3 w-full">
                <div class="flex items-center gap-3 bg-white/40 p-3 rounded-lg">
                    <span class="material-icons text-orange-400">emoji_events</span>
                    <span class="text-sm font-bold text-[#2c5282]">最高得分: 8,888</span>
                </div>
                <div class="flex items-center gap-3 bg-white/40 p-3 rounded-lg">
                    <span class="material-icons text-game-pink">favorite</span>
                    <span class="text-sm font-bold text-[#2c5282]">體力值: 5/5</span>
                </div>
            </div>
            
            <!-- 遊戲列表 -->
            <div class="mt-8 w-full">
                <h3 class="text-lg font-bold text-[#2c5282] mb-4">遊戲列表</h3>
                <div class="space-y-3">
                    <a href="fruit.html" class="flex items-center gap-3 bg-white/50 p-3 rounded-lg hover:bg-white/80 transition-colors cursor-pointer border-l-4 border-primary">
                        <span class="material-icons text-primary">sports_esports</span>
                        <div class="flex flex-col">
                            <span class="font-bold text-[#2c5282]">接水果遊戲</span>
                            <span class="text-xs text-[#4a7a96]">點擊開始遊玩</span>
                        </div>
                    </a>
                </div>
            </div>
            
            <div class="mt-auto pt-8">
                <p class="text-xs font-semibold text-[#2c5282]/60 uppercase tracking-widest">© 2024 sabrina</p>
            </div>
        </header>
        
        <!-- 主內容區 -->
        <main class="p-6 md:p-10 flex flex-col justify-center">
            <!-- 主要遊戲卡片 -->
            <div class="w-full max-w-4xl mx-auto flex flex-col md:flex-row bg-white/80 rounded-xl shadow-2xl overflow-hidden border-4 border-white/50 backdrop-blur-md">
                <div class="md:w-5/12 bg-pale-yellow/40 p-8 flex items-center justify-center relative overflow-hidden">
                    <div class="absolute top-4 left-4">
                        <span class="material-icons text-game-pink text-3xl animate-bounce">apple</span>
                    </div>
                    <div class="absolute bottom-4 right-4">
                        <span class="material-icons text-soft-green text-3xl">local_florist</span>
                    </div>
                    <img alt="Cute fruit character" class="w-full h-48 md:h-64 object-contain drop-shadow-2xl z-10" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAVZnM6RBH8TKz_f_w-HJBngWhuK3UME5RzTa2Qxg_NHQWnu2cf7avdxU8J3-P2lda5KRim98FCFJDQLqopK_oKrmwRHmZTc1giyDoLVGhkdJaM0uQU8Byy5kjWZ3u9nUkOzDUzl33M6ldbUPFF1iGGg2_jV8JjH9p3IAQfkpBmgd11IZvsV1XsUyWQZ3B1FmpxqHxl95O0JuF6_WXypReVD41j99Dd9wuvJXPXfl_vtf6wAQEIDPQWXOO8J3spvMCoVh_Mczwtl_39"/>
                    <div class="absolute inset-0 bg-gradient-to-br from-transparent to-white/30"></div>
                </div>
                
                <div class="md:w-7/12 p-8 flex flex-col justify-center">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="bg-soft-green/30 text-[#4a7c4a] px-3 py-1 rounded-full text-xs font-bold">熱門遊戲</span>
                        <span class="bg-primary/20 text-[#2c5282] px-3 py-1 rounded-full text-xs font-bold">休閒</span>
                    </div>
                    
                    <h2 class="text-4xl font-bold text-[#2c5282] mb-4">星果跳跳接</h2>
                    
                    <p class="text-[#546e7a] text-lg mb-8 leading-relaxed">
                        在迷人的星空下挑戰你的反應！接住從天而降的繽紛水果。這是一個適合所有年齡層的歡樂挑戰。
                    </p>
                    
                    <div class="flex gap-4">
                        <a href="fruit.html" class="flex-grow group relative h-20 bg-soft-green hover:bg-[#7edb7e] rounded-full flex items-center justify-center transition-all active:scale-95 shadow-xl overflow-hidden border-b-4 border-[#6dbb6d] no-underline">
                            <div class="absolute top-0 left-0 w-full h-full bg-white/20 -skew-x-12 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700"></div>
                            <div class="flex items-center gap-3 z-10">
                                <span class="material-icons text-white text-4xl">play_arrow</span>
                                <span class="text-2xl font-black text-white uppercase tracking-widest">開始遊戲</span>
                            </div>
                            <div class="absolute -top-1 right-12 w-5 h-7 bg-[#4ade80] rounded-full rotate-45 border-2 border-white/50"></div>
                        </a>
                        
                        <button class="w-20 h-20 bg-game-pink hover:bg-[#ffb3c0] rounded-full flex items-center justify-center transition-all active:scale-95 shadow-xl border-b-4 border-[#e5aeb8]" onclick="shareGame()">
                            <span class="material-icons text-white text-3xl">share</span>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- 功能卡片 -->
            <div class="mt-8 flex gap-4 overflow-x-auto pb-4 scrollbar-hide">
                <div class="min-w-[160px] bg-white/50 backdrop-blur-sm p-4 rounded-xl flex items-center gap-3 border-2 border-white/50 cursor-pointer hover:bg-white/80 transition-colors" onclick="showFeature('daily')">
                    <div class="w-12 h-12 bg-primary/20 rounded-full flex items-center justify-center">
                        <span class="material-icons text-primary">auto_fix_high</span>
                    </div>
                    <span class="font-bold text-[#2c5282]">每日轉盤</span>
                </div>
                
                <div class="min-w-[160px] bg-white/50 backdrop-blur-sm p-4 rounded-xl flex items-center gap-3 border-2 border-white/50 cursor-pointer hover:bg-white/80 transition-colors" onclick="showFeature('leaderboard')">
                    <div class="w-12 h-12 bg-soft-green/20 rounded-full flex items-center justify-center">
                        <span class="material-icons text-soft-green">leaderboard</span>
                    </div>
                    <span class="font-bold text-[#2c5282]">排行榜</span>
                </div>
                
                <div class="min-w-[160px] bg-white/50 backdrop-blur-sm p-4 rounded-xl flex items-center gap-3 border-2 border-white/50 cursor-pointer hover:bg-white/80 transition-colors" onclick="showFeature('shop')">
                    <div class="w-12 h-12 bg-pale-yellow rounded-full flex items-center justify-center">
                        <span class="material-icons text-orange-400">shopping_bag</span>
                    </div>
                    <span class="font-bold text-[#2c5282]">道具商店</span>
                </div>
                
                <div class="min-w-[160px] bg-white/50 backdrop-blur-sm p-4 rounded-xl flex items-center gap-3 border-2 border-white/50 cursor-pointer hover:bg-white/80 transition-colors" onclick="showFeature('settings')">
                    <div class="w-12 h-12 bg-game-pink/20 rounded-full flex items-center justify-center">
                        <span class="material-icons text-game-pink">settings</span>
                    </div>
                    <span class="font-bold text-[#2c5282]">遊戲設定</span>
                </div>
            </div>
        </main>
    </div>
    
    <!-- 背景裝飾元素 -->
    <div class="fixed top-0 right-0 w-96 h-96 bg-white/20 rounded-full blur-[100px] -z-10 pointer-events-none"></div>
    <div class="fixed bottom-0 left-0 w-[500px] h-[500px] bg-primary/10 rounded-full blur-[120px] -z-10 pointer-events-none"></div>
    <div class="fixed top-1/2 left-1/4 w-64 h-64 bg-game-pink/10 rounded-full blur-[80px] -z-10 pointer-events-none"></div>
    
    <div class="h-4 bg-transparent"></div>
    
    <script>
        // 功能按鈕點擊處理
        function showFeature(feature) {
            const features = {
                'daily': '每日轉盤功能即將推出！',
                'leaderboard': '排行榜功能開發中...',
                'shop': '道具商店即將開放！',
                'settings': '遊戲設定功能開發中...'
            };
            
            alert(features[feature] || '功能即將推出！');
        }
        
        // 分享遊戲功能
        function shareGame() {
            if (navigator.share) {
                navigator.share({
                    title: 'Fruit Star Fall - 接水果遊戲',
                    text: '來玩這個有趣的接水果遊戲吧！',
                    url: window.location.href,
                })
                .then(() => console.log('分享成功'))
                .catch((error) => console.log('分享失敗', error));
            } else {
                alert('分享連結已複製到剪貼簿！\n網址: ' + window.location.href);
                // 複製到剪貼簿
                navigator.clipboard.writeText(window.location.href)
                    .then(() => console.log('連結已複製'))
                    .catch(err => console.error('複製失敗:', err));
            }
        }
    </script>
</body>
</html>
